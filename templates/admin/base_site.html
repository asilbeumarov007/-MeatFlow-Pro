{% extends "admin/base.html" %}

{% block title %}Dashboard | {{ site_title|default:_('Django site admin') }}{% endblock %}

{% block branding %}
<h1 id="site-name">
  <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 8px;">
    <div style="width: 24px; height: 24px; background: linear-gradient(135deg, #10B981, #065F46); border-radius: 6px; box-shadow: 0 0 10px rgba(16,185,129,0.5);"></div>
    MeatFlow Pro
  </a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Fintech Dark Theme Overrides for Django Admin */
  :root {
    --primary: #10B981;
    --secondary: #04110D;
    --accent: #D4A853;
    
    --body-fg: #C9D1D9;
    --body-bg: #0B0E14;
    --body-quiet-color: #8B949E;
    --body-loud-color: #E2E8F0;
    
    --header-color: #04110D;
    --header-branding-color: #ffffff;
    --header-bg: #04110D;
    --header-link-color: #10B981;
    
    --breadcrumbs-fg: #C9D1D9;
    --breadcrumbs-link-fg: #10B981;
    --breadcrumbs-bg: #061611;
    
    --link-fg: #10B981;
    --link-hover-color: #34D399;
    --link-selected-fg: #10B981;
    
    --button-bg: #10B981;
    --button-hover-bg: #059669;
    
    --object-tools-bg: #04110D;
    --object-tools-hover-bg: #065F46;
    
    --darkened-bg: #0B0E14;
    --selected-bg: #065F46;
    --selected-row: #065F46;
  }
  
  body {
    background-color: var(--body-bg) !important;
    color: var(--body-fg) !important;
    font-family: 'Plus Jakarta Sans', sans-serif !important;
  }
  
  #header {
    background: var(--header-bg);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #header a:link, #header a:visited { color: #ffffff; }
  
  #nav-sidebar {
    background-color: #04110D !important;
    border-right: 1px solid rgba(255,255,255,0.05) !important;
  }
  
  /* Make sidebar links look modern */
  .app-list th a, .app-list td a {
    color: #8B949E !important;
    font-weight: 500 !important;
    transition: all 0.2s ease;
  }
  .app-list th a:hover, .app-list td a:hover {
    color: #10B981 !important;
    transform: translateX(4px);
  }
  .app-list .current-app th a { color: #10B981 !important; font-weight: 700 !important; }
  
  caption {
    background-color: rgba(16,185,129,0.05) !important;
    color: #10B981 !important;
    font-weight: 700 !important;
    border-bottom: 1px solid rgba(16,185,129,0.1);
  }
  
  #content {
    background: var(--body-bg);
  }
  
  /* Default tables in admin */
  table { border-collapse: separate !important; border-spacing: 0 !important; }
  thead th {
    background: #061611 !important;
    color: #8B949E !important;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(255,255,255,0.05) !important;
  }
  tbody tr { background: #0B0E14 !important; transition: background 0.2s; }
  tbody tr:nth-child(even) { background: #080A10 !important; }
  tbody tr:hover { background: rgba(16,185,129,0.05) !important; }
  td, th { border-bottom: 1px solid rgba(255,255,255,0.05) !important; }
  
  /* Input fields */
  input[type="text"], input[type="password"], input[type="email"], input[type="url"], input[type="number"], select, textarea {
    background-color: #04110D !important;
    border: 1px solid rgba(255,255,255,0.1) !important;
    color: #ffffff !important;
    border-radius: 6px;
  }
  input:focus, select:focus, textarea:focus { border-color: #10B981 !important; outline: none; box-shadow: 0 0 0 2px rgba(16,185,129,0.2) !important; }
</style>
{% endblock %}
