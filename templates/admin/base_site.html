{% extends "admin/base.html" %}

{% block title %}Dashboard | {{ site_title|default:_('Django site admin') }}{% endblock %}

{% block branding %}
<h1 id="site-name">
  <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 8px;">
    <div style="width: 24px; height: 24px; background: linear-gradient(135deg, #10B981, #065F46); border-radius: 6px; box-shadow: 0 0 10px rgba(16,185,129,0.5);"></div>
    <span style="color: #ffffff !important;">MeatFlow Pro</span>
  </a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
{% endblock %}
