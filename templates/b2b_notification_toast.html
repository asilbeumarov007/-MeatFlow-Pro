{% if user.is_superuser %}
<!-- Bootstrap Icons for notification page support -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Floating B2B Notification Toast for Admin -->
<div id="b2b-toast-notification" class="position-fixed bottom-0 end-0 m-4 p-4 shadow-lg d-none" style="z-index: 1060; width: 340px; background: #FFFFFF; border: 1.5px solid rgba(27,107,74,0.15); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15) !important; font-family: 'Inter', sans-serif;">
    <div class="d-flex align-items-start gap-3">
        <div class="rounded-circle p-2 d-flex align-items-center justify-content-center" style="background: rgba(27,107,74,0.1); color: #1B6B4A; width: 44px; height: 44px; flex-shrink: 0;">
            <i class="bi bi-bell-fill fs-5 animate-bell-wiggle"></i>
        </div>
        <div class="flex-grow-1">
            <h6 class="fw-bold mb-1" style="color: #1B6B4A; font-size: 14px;">B2B Yangi Buyurtma!</h6>
            <p id="b2b-toast-text" class="text-muted mb-3 small" style="line-height: 1.4; font-size: 12px; margin: 0 0 16px 0;">Sizda kutilayotgan yangi buyurtmalar bor.</p>
            <div class="d-flex flex-column gap-2">
                <div class="d-flex gap-2">
                    <a id="b2b-toast-chat-link" href="/pos/chats/" class="btn btn-sm btn-success flex-grow-1 py-2 fw-semibold text-center" style="font-size: 11px; border-radius: 8px; background: linear-gradient(135deg, #1B6B4A, #2D9B6E); border: none; color:#FFFFFF; text-decoration:none; display: inline-block;">
                        💬 Chatga o'tish
                    </a>
                    <a id="b2b-toast-notif-link" href="/pos/chats/" class="btn btn-sm btn-outline-success flex-grow-1 py-2 fw-semibold text-center" style="font-size: 11px; border-radius: 8px; border: 1.5px solid #1B6B4A; color:#1B6B4A; text-decoration:none; display: inline-block; background:transparent;">
                        🔔 Bildirishnomalar
                    </a>
                </div>
                <button onclick="snoozeB2BToast()" class="btn btn-sm btn-light text-muted w-100 py-1.5 fw-semibold" style="font-size: 11px; border-radius: 8px; background: #F3F4F6; border: none; cursor: pointer;">
                    ⏰ Keyinroq eslat
                </button>
            </div>
        </div>
    </div>
</div>

<style>
@keyframes wiggle-anim {
  0% { transform: rotate(0); }
  15% { transform: rotate(10deg); }
  30% { transform: rotate(-10deg); }
  45% { transform: rotate(5deg); }
  60% { transform: rotate(-5deg); }
  75% { transform: rotate(2deg); }
  85% { transform: rotate(-2deg); }
  100% { transform: rotate(0); }
}
.animate-bell-wiggle {
  display: inline-block;
  animation: wiggle-anim 2s infinite;
}
</style>

<script>
function snoozeB2BToast() {
    const snoozeTime = Date.now() + 3 * 60 * 1000; // Snooze for 3 minutes
    localStorage.setItem('b2b_toast_snoozed_until', snoozeTime);
    const toast = document.getElementById('b2b-toast-notification');
    if (toast) toast.classList.add('d-none');
}

document.addEventListener("DOMContentLoaded", () => {
    function checkB2BOrdersCount() {
        fetch('/pos/api/b2b-orders/pending-count/')
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    // 1. Update navbar badge if it exists on page
                    const badge = document.getElementById('pending-b2b-badge');
                    if (badge) {
                        if (data.count > 0) {
                            badge.innerText = data.count;
                            badge.classList.remove('d-none');
                        } else {
                            badge.classList.add('d-none');
                        }
                    }

                    // 2. Manage floating toast notification
                    const toast = document.getElementById('b2b-toast-notification');
                    if (toast) {
                        if (data.count > 0) {
                            const snoozedUntil = localStorage.getItem('b2b_toast_snoozed_until');
                            const now = Date.now();
                            if (!snoozedUntil || now > parseInt(snoozedUntil)) {
                                // Customize text depending on count
                                if (data.count === 1) {
                                    document.getElementById('b2b-toast-text').innerText = `👤 ${data.latest_customer_name} dan B2B buyurtma tushdi!`;
                                } else {
                                    document.getElementById('b2b-toast-text').innerText = `👤 ${data.latest_customer_name} va boshqalardan ${data.count} ta yangi buyurtma bor.`;
                                }

                                // Update links to directly select the customer
                                if (data.latest_customer_id) {
                                    const chatLink = `/pos/chats/?selected_customer=${data.latest_customer_id}`;
                                    document.getElementById('b2b-toast-chat-link').href = chatLink;
                                    document.getElementById('b2b-toast-notif-link').href = chatLink;
                                } else {
                                    document.getElementById('b2b-toast-chat-link').href = '/pos/chats/';
                                    document.getElementById('b2b-toast-notif-link').href = '/pos/chats/';
                                }

                                toast.classList.remove('d-none');
                            } else {
                                toast.classList.add('d-none');
                            }
                        } else {
                            toast.classList.add('d-none');
                        }
                    }
                }
            })
            .catch(err => console.error("Error fetching B2B count:", err));
    }

    // Initial check
    checkB2BOrdersCount();

    // Poll every 10 seconds
    setInterval(checkB2BOrdersCount, 10000);
});
</script>
{% endif %}
